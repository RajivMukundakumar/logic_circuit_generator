<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Logic & Universal Gate Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 text-gray-800">

    <div class="max-w-5xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-2 text-blue-600">Digital Logic & Universal Gate Generator</h1>
        <p class="text-gray-600 mb-8">Enter minterms like <code class="bg-gray-200 px-1 rounded">m(0,1,2)</code> or truth table outputs like <code class="bg-gray-200 px-1 rounded">0,1,1,0</code>.</p>

        <div class="mb-8 p-6 bg-gray-50 border rounded grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="col-span-1 md:col-span-2">
                <label class="block text-sm font-bold mb-2">Input Logic Specification:</label>
                <textarea id="userInput" rows="2" class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono" placeholder="e.g. m(0,1,2,5) or 0,1,1,0"></textarea>
            </div>

            <div class="col-span-1">
                <label class="block text-sm font-bold mb-2">Gate Logic Type:</label>
                <select id="gateType" class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="standard">Standard (AND / OR / NOT)</option>
                    <option value="nand">NAND-Only (Universal)</option>
                    <option value="nor">NOR-Only (Universal)</option>
                </select>
            </div>

            <div class="col-span-1 md:col-span-3">
                <button onclick="solveLogic()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition duration-200">
                    Solve & Draw Circuit
                </button>
            </div>
        </div>

        <div id="loading" class="hidden text-center text-blue-600 font-bold mb-8">
            Analyzing logic and rendering schematics...
        </div>

        <div id="results" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-6 border rounded shadow-sm">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">Simplified Expressions</h2>
                <p class="mb-2"><strong>SOP:</strong> <span id="sopOutput" class="font-mono text-blue-700 font-semibold"></span></p>
                <p><strong>POS:</strong> <span id="posOutput" class="font-mono text-blue-700 font-semibold"></span></p>
            </div>

            <div class="p-6 border rounded shadow-sm bg-gray-50">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">Minimization Summary</h2>
                <p id="explanation" class="text-sm leading-relaxed text-gray-700"></p>
            </div>

            <div class="col-span-1 md:col-span-2 p-6 border rounded shadow-sm">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">Logic Circuit Diagram</h2>
                <div id="circuitImage" class="flex justify-center items-center bg-gray-50 p-4 border border-dashed border-gray-300 min-h-[250px] overflow-x-auto">
                </div>
            </div>
        </div>
    </div>

    <script>
        async function solveLogic() {
            const input = document.getElementById('userInput').value.trim();
            const gateType = document.getElementById('gateType').value;

            if (!input) {
                alert("Please enter a valid minterm or truth table output format.");
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                const response = await fetch('https://logic-circuit-generator.onrender.com/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: input, gate_type: gateType })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Failed to calculate expression');
                }

                const data = await response.json();

                document.getElementById('sopOutput').innerText = data.sop;
                document.getElementById('posOutput').innerText = data.pos;
                document.getElementById('explanation').innerText = data.explanation;
                document.getElementById('circuitImage').innerHTML = data.svg;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('results').classList.remove('hidden');

            } catch (error) {
                console.error("Error:", error);
                alert(error.message || "Something went wrong connecting to the logic engine.");
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
